name: T3 Lab (local build)

# Builds the "T3 Lab" desktop variant on this Mac's self-hosted runner and
# installs it into /Applications. A Selfactor machine job dispatches it daily;
# it skips when main has not moved since the last install. Run it by hand with
# `gh workflow run t3-lab-local.yml -R selfactor/t3code -f force=true`.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not changed since the last install
        type: boolean
        default: false

concurrency:
  group: t3-lab-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Check for changes
        id: changes
        env:
          FORCE: ${{ inputs.force }}
        run: |
          sha="$(git rev-parse HEAD)"
          installed="$(cat "$HOME/.t3lab/deployed-sha" 2>/dev/null || true)"
          staged="$(cat "$HOME/.t3lab/pending/sha" 2>/dev/null || true)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" == "true" || ( "$sha" != "$installed" && "$sha" != "$staged" ) ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "main is at $sha, already installed or staged; nothing to do."
          fi

      - name: Set up toolchain
        if: steps.changes.outputs.build == 'true'
        uses: ./.github/actions/setup-ci-deps

      # The resource monitor needs rustc 1.95+; pin it here so the machine's
      # default stable (used by other repos) is left alone.
      - name: Set up Rust
        if: steps.changes.outputs.build == 'true'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=1.95.0" >> "$GITHUB_ENV"

      - name: Build T3 Lab.app
        if: steps.changes.outputs.build == 'true'
        env:
          T3CODE_DESKTOP_VARIANT: lab
        # The packager reads the resource monitor from the crate's own target dir.
        run: |
          unset CARGO_TARGET_DIR
          vp run dist:desktop:artifact --platform mac --target dir --arch arm64 \
            --output-dir "$RUNNER_TEMP/t3lab"

      - name: Install
        if: steps.changes.outputs.build == 'true'
        run: |
          app="$(find "$RUNNER_TEMP/t3lab" -maxdepth 3 -name 'T3 Lab.app' -type d | head -1)"
          test -n "$app" || { echo "no T3 Lab.app in build output"; exit 1; }
          scripts/t3-lab/deploy.sh "$app" "${{ steps.changes.outputs.sha }}"
